name: Build Az Zeu Sacco V14
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Create Az Zeu Sacco App
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/az/zeu
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.az.zeu'
            compileSdk 34
            defaultConfig {
              applicationId "com.az.zeu"
              minSdk 24; targetSdk 34
              versionCode 14; versionName "14.0-Az-Zeu"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget='17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.foundation:foundation'
            implementation 'androidx.compose.material:material-icons-extended'
          }
          EOF
          cat > app/src/main/java/com/az/zeu/MainActivity.kt <<'KOT'
          package com.az.zeu
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.*
          data class Member(val id:Int, val name:String, val dept:String, val staffId:String, var savings:Double=0.0, var shares:Int=0, var loanBal:Double=0.0, var isGuarantor:Boolean=false)
          data class Loan(val id:Int, val memberId:Int, val type:String, val amount:Double, val interest:Double, val months:Int, var status:String, val guarantors:List<Int>, val date:String)
          data class Txn(val date:String, val memberId:Int, val type:String, val amount:Double, val desc:String)
          class MainActivity : ComponentActivity() { override fun onCreate(b: Bundle?) { super.onCreate(b); setContent { SaccoApp() } } }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SaccoApp(){
            var pin by remember { mutableStateOf("") }; var inputPin by remember { mutableStateOf("") }; var locked by remember { mutableStateOf(true) }; var firstTime by remember { mutableStateOf(true) }; var err by remember { mutableStateOf("") }
            var tab by remember { mutableStateOf(0) }
            var members by remember { mutableStateOf(listOf(Member(1,"Amina K.","Finance","AZ001",150000.0,10,0.0), Member(2,"Joseph M.","Operations","AZ002",200000.0,15,50000.0), Member(3,"Grace W.","HR","AZ003",50000.0,3,0.0))) }
            var loans by remember { mutableStateOf(listOf(Loan(1,2,"Emergency",200000.0,10.0,6,"Active",listOf(1,3),"22-08-2026"))) }
            var txns by remember { mutableStateOf(listOf(Txn("22-08-2026",1,"Saving",50000.0,"Compulsory"),Txn("22-08-2026",2,"Saving",50000.0,"Compulsory"))) }
            var selMember by remember { mutableStateOf<Member?>(null) }
            var showAdd by remember { mutableStateOf(false) }; var showLoan by remember { mutableStateOf(false) }; var showShares by remember { mutableStateOf(false) }
            var nName by remember { mutableStateOf("") }; var nDept by remember { mutableStateOf("") }; var nStaff by remember { mutableStateOf("") }
            var lMemberId by remember { mutableStateOf("1") }; var lAmount by remember { mutableStateOf("100000") }; var lMonths by remember { mutableStateOf("6") }; var lType by remember { mutableStateOf("Emergency") }
            val Green = Color(0xFF0D4D2A); val Gold = Color(0xFFFFC107)
            fun totalSavings() = members.sumOf{it.savings}; fun totalShares() = members.sumOf{it.shares}; fun totalLoans() = loans.filter{it.status=="Active"}.sumOf{it.amount}
            fun box() = totalSavings() - totalLoans()*0.2
            if(locked){
              Box(Modifier.fillMaxSize().background(Green), contentAlignment=Alignment.Center){
                Card(Modifier.padding(20.dp).fillMaxWidth(), shape=RoundedCornerShape(24.dp)){
                  Column(Modifier.padding(20.dp), horizontalAlignment=Alignment.CenterHorizontally){
                    Text("AZ ZEU SACCO", fontWeight=FontWeight.Bold, fontSize=20.sp, color=Green); Text("V14.0 Complete Worker Sacco", fontSize=11.sp); Text("Box: ${totalSavings().toInt()} UGX • Loans: ${loans.size}", fontSize=10.sp, modifier=Modifier.padding(top=4.dp))
                    OutlinedTextField(value=inputPin, onValueChange={if(it.length<=4) inputPin=it.filter{c->c.isDigit()}}, label={Text("4-Digit PIN")}, modifier=Modifier.fillMaxWidth().padding(top=12.dp)); if(err!="") Text(err, color=Color.Red, fontSize=12.sp)
                    Button(onClick={if(firstTime){if(inputPin.length==4){pin=inputPin; firstTime=false; locked=false; inputPin=""} else err="Enter 4 digits"} else {if(inputPin==pin){locked=false; inputPin=""} else err="Wrong PIN"}}, modifier=Modifier.fillMaxWidth().padding(top=8.dp), colors=ButtonDefaults.buttonColors(containerColor=Green)){Text(if(firstTime) "SET PIN & ENTER" else "UNLOCK SACCO")}
                  }
                }
              }
            } else {
              Scaffold(bottomBar={ NavigationBar{ listOf("Dashboard","Members","Loans","Reports").forEachIndexed{ i,t-> NavigationBarItem(selected=tab==i, onClick={tab=i; selMember=null}, label={Text(t,fontSize=9.sp)}, icon={Text(if(i==0)"📊" else if(i==1)"👥" else if(i==2)"💰" else "📑")}) } } }){ pad->
                Column(Modifier.fillMaxSize().background(Color(0xFFF6F6F6)).padding(pad)){
                  Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=Green), shape=RoundedCornerShape(bottomStart=16.dp,bottomEnd=16.dp)){ Row(Modifier.padding(12.dp).fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween, verticalAlignment=Alignment.CenterVertically){ Column{Text("AZ ZEU SACCO V14.0",color=Color.White,fontWeight=FontWeight.Bold); Text("Box ${totalSavings().toInt()} | Shares ${totalShares()} | Loans ${totalLoans().toInt()}",color=Color.White,fontSize=10.sp)}; Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){Box(Modifier.clip(CircleShape).background(Color.White).clickable{locked=true}.size(30.dp), contentAlignment=Alignment.Center){Text("🔒")}; Box(Modifier.clip(CircleShape).background(Gold).size(30.dp), contentAlignment=Alignment.Center){Text("${members.size}")}} } }
                  if(selMember!=null){
                    val m=selMember!!; val mLoans=loans.filter{it.memberId==m.id}; val mTxns=txns.filter{it.memberId==m.id}
                    LazyColumn(Modifier.padding(10.dp)){ item{
                      Card(Modifier.fillMaxWidth()){ Row(Modifier.padding(10.dp), verticalAlignment=Alignment.CenterVertically){Box(Modifier.size(36.dp).clip(CircleShape).background(Color(0xFFFFE082)).clickable{selMember=null}, contentAlignment=Alignment.Center){Text("←")}; Spacer(Modifier.width(8.dp)); Column{Text("${m.name} (${m.staffId})",fontWeight=FontWeight.Bold); Text("${m.dept} • Savings ${m.savings.toInt()} • Shares ${m.shares} • Loan Bal ${m.loanBal.toInt()}",fontSize=10.sp)}}}
                      Spacer(Modifier.height(8.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.spacedBy(6.dp)){
                        Card(Modifier.weight(1f)){Column(Modifier.padding(8.dp), horizontalAlignment=Alignment.CenterHorizontally){Text("Savings",fontSize=9.sp); Text("${m.savings.toInt()}",fontWeight=FontWeight.Bold,color=Green)}}
                        Card(Modifier.weight(1f)){Column(Modifier.padding(8.dp), horizontalAlignment=Alignment.CenterHorizontally){Text("Shares",fontSize=9.sp); Text("${m.shares}",fontWeight=FontWeight.Bold)}}
                        Card(Modifier.weight(1f)){Column(Modifier.padding(8.dp), horizontalAlignment=Alignment.CenterHorizontally){Text("Loans",fontSize=9.sp); Text("${mLoans.size}",fontWeight=FontWeight.Bold,color=Color.Red)}}
                      }
                      Spacer(Modifier.height(8.dp))
                      Card(Modifier.fillMaxWidth()){Column(Modifier.padding(10.dp)){Text("Add Transaction",fontWeight=FontWeight.Bold,fontSize=12.sp)
                        Row(horizontalArrangement=Arrangement.spacedBy(4.dp), modifier=Modifier.padding(top=6.dp)){
                          Button(onClick={members=members.map{if(it.id==m.id) it.copy(savings=it.savings+50000) else it}; txns=txns+Txn(SimpleDateFormat("dd-MM-yyyy",Locale.getDefault()).format(Date()),m.id,"Saving",50000.0,"Compulsory 50k")}, colors=ButtonDefaults.buttonColors(containerColor=Green), contentPadding=PaddingValues(6.dp), modifier=Modifier.weight(1f)){Text("+50k Save",fontSize=9.sp)}
                          Button(onClick={showShares=true}, colors=ButtonDefaults.buttonColors(containerColor=Gold), contentPadding=PaddingValues(6.dp), modifier=Modifier.weight(1f)){Text("Buy Share",fontSize=9.sp,color=Color.Black)}
                          Button(onClick={showLoan=true; lMemberId=m.id.toString()}, colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF1565C0)), contentPadding=PaddingValues(6.dp), modifier=Modifier.weight(1f)){Text("Give Loan",fontSize=9.sp)}
                        }
                      }}
                      Spacer(Modifier.height(8.dp))
                      Card(Modifier.fillMaxWidth()){Column(Modifier.padding(10.dp)){Text("Member Statement (All Visible)",fontWeight=FontWeight.Bold,fontSize=11.sp); mTxns.reversed().take(20).forEach{t->Text("📅 ${t.date} ${t.type} ${t.amount.toInt()} ${t.desc}",fontSize=10.sp)}; if(mLoans.isNotEmpty()){Spacer(Modifier.height(6.dp)); Text("Loans:",fontWeight=FontWeight.Bold,fontSize=11.sp); mLoans.forEach{l->Text("💰 ${l.type} ${l.amount.toInt()} ${l.months}mo ${l.interest}% ${l.status} Guarantors:${l.guarantors}",fontSize=10.sp)}}}}
                    }}
                  } else {
                    when(tab){
                      0-> LazyColumn(Modifier.padding(10.dp)){ item{
                        Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.spacedBy(6.dp)){
                          Card(Modifier.weight(1f), colors=CardDefaults.cardColors(containerColor=Color.White)){Column(Modifier.padding(10.dp)){Text("Total Savings",fontSize=10.sp); Text("${totalSavings().toInt()} UGX",fontWeight=FontWeight.Bold,color=Green)}}
                          Card(Modifier.weight(1f), colors=CardDefaults.cardColors(containerColor=Color.White)){Column(Modifier.padding(10.dp)){Text("Total Loans",fontSize=10.sp); Text("${totalLoans().toInt()} UGX",fontWeight=FontWeight.Bold,color=Color.Red)}}
                        }
                        Spacer(Modifier.height(6.dp))
                        Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.spacedBy(6.dp)){
                          Card(Modifier.weight(1f)){Column(Modifier.padding(10.dp)){Text("Members",fontSize=10.sp); Text("${members.size}",fontWeight=FontWeight.Bold)}}
                          Card(Modifier.weight(1f)){Column(Modifier.padding(10.dp)){Text("Shares",fontSize=10.sp); Text("${totalShares()} shares @20k",fontWeight=FontWeight.Bold)}}
                          Card(Modifier.weight(1f)){Column(Modifier.padding(10.dp)){Text("Box Balance",fontSize=10.sp); Text("${box().toInt()}",fontWeight=FontWeight.Bold,color=Green)}}
                        }
                        Spacer(Modifier.height(8.dp))
                        Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=Color(0xFFE8F5E9))){Column(Modifier.padding(10.dp)){Text("SACCO LAWS DEFAULT",fontWeight=FontWeight.Bold,fontSize=12.sp); Text("• Compulsory Saving: 50,000 UGX/month\n• Share: 20,000 UGX each\n• Loan: Max 3x Savings, 10% interest, 6-12 months\n• Guarantors: 2 members mandatory, savings blocked\n• Dividend: Year end profit / shares\n• Withdraw: 60 days notice",fontSize=11.sp)}}
                        Spacer(Modifier.height(8.dp))
                        Card(Modifier.fillMaxWidth()){Column(Modifier.padding(10.dp)){Text("Recent Transactions (All Visible)",fontWeight=FontWeight.Bold,fontSize=11.sp); txns.reversed().take(10).forEach{t->Text("${t.date} M#${t.memberId} ${t.type} ${t.amount.toInt()} ${t.desc}",fontSize=10.sp)}}}
                      }}
                      1-> LazyColumn(Modifier.padding(10.dp)){ item{
                        Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween, verticalAlignment=Alignment.CenterVertically){Text("Members (${members.size}) Tap to View",fontWeight=FontWeight.Bold,color=Green); Button(onClick={showAdd=true}, colors=ButtonDefaults.buttonColors(containerColor=Green), contentPadding=PaddingValues(8.dp)){Text("+ Add Staff",fontSize=11.sp)}}
                        Spacer(Modifier.height(8.dp))
                        members.forEach{m-> Card(Modifier.fillMaxWidth().padding(vertical=3.dp).clickable{selMember=m}){Row(Modifier.padding(10.dp).fillMaxWidth(), verticalAlignment=Alignment.CenterVertically){Box(Modifier.size(36.dp).clip(CircleShape).background(Gold), contentAlignment=Alignment.Center){Text(m.name.take(2).uppercase(),fontWeight=FontWeight.Bold,fontSize=10.sp)}; Spacer(Modifier.width(8.dp)); Column(Modifier.weight(1f)){Text("#${m.staffId} ${m.name}",fontWeight=FontWeight.Bold,fontSize=12.sp); Text("${m.dept} • Save:${m.savings.toInt()} • Shares:${m.shares} • Loan:${m.loanBal.toInt()} ${if(m.isGuarantor)"🔒Guarantor" else ""}",fontSize=10.sp,color=Color.Gray)}; Text("View >",color=Green,fontSize=10.sp)}}}
                      }}
                      2-> LazyColumn(Modifier.padding(10.dp)){ item{
                        Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween){Text("Loans (${loans.size}) Complete Module",fontWeight=FontWeight.Bold,color=Green); Button(onClick={showLoan=true}, colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF1565C0)), contentPadding=PaddingValues(8.dp)){Text("+ New Loan",fontSize=11.sp)}}
                        Spacer(Modifier.height(8.dp))
                        loans.reversed().forEach{l-> val mem=members.find{it.id==l.memberId}; Card(Modifier.fillMaxWidth().padding(vertical=3.dp)){Column(Modifier.padding(10.dp)){Text("Loan #${l.id} ${mem?.name} (${l.type})",fontWeight=FontWeight.Bold,fontSize=11.sp); Text("Amount ${l.amount.toInt()} + ${l.interest}% = ${(l.amount*(1+l.interest/100)).toInt()} | ${l.months} months | ${(l.amount*(1+l.interest/100)/l.months).toInt()}/mo",fontSize=10.sp); Text("Status: ${l.status} | Guarantors: ${l.guarantors.joinToString()} | Date: ${l.date}",fontSize=9.sp,color=Color.Gray); Row(Modifier.padding(top=4.dp), horizontalArrangement=Arrangement.spacedBy(4.dp)){ if(l.status=="Active"){ Button(onClick={loans=loans.map{if(it.id==l.id) it.copy(status="Paid") else it}; members=members.map{if(it.id==l.memberId) it.copy(loanBal=0.0) else it}}, colors=ButtonDefaults.buttonColors(containerColor=Green), contentPadding=PaddingValues(4.dp)){Text("Mark Paid",fontSize=9.sp)} } }}}}
                      }}
                      3-> LazyColumn(Modifier.padding(10.dp)){ item{
                        Text("Reports & Audit - All Visible",fontWeight=FontWeight.Bold,color=Green); Spacer(Modifier.height(8.dp))
                        Card(Modifier.fillMaxWidth()){Column(Modifier.padding(10.dp)){Text("AZ ZEU SACCO SUMMARY",fontWeight=FontWeight.Bold); Text("Total Savings: ${totalSavings().toInt()} UGX\nTotal Shares: ${totalShares()} x 20,000 = ${totalShares()*20000} UGX\nTotal Loans Active: ${totalLoans().toInt()} UGX\nBox Cash: ${box().toInt()} UGX\nMembers: ${members.size}\nDefault Rate: 10% interest",fontSize=11.sp)}}
                        Spacer(Modifier.height(8.dp))
                        Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=Gold)){Column(Modifier.padding(10.dp)){Text("Share Dividend Simulation (Year End)",fontWeight=FontWeight.Bold,fontSize=11.sp); val profit=totalLoans()*0.1; Text("Profit from loans interest: ${profit.toInt()} UGX\nDividend per share: ${if(totalShares()>0) (profit/totalShares()).toInt() else 0} UGX\n",fontSize=10.sp)}}
                      }}
                    }
                  }
                  if(showAdd){
                    AlertDialog(onDismissRequest={showAdd=false}, title={Text("Add Staff Member")}, text={Column{ OutlinedTextField(value=nName,onValueChange={nName=it},label={Text("Full Name")},modifier=Modifier.fillMaxWidth()); OutlinedTextField(value=nDept,onValueChange={nDept=it},label={Text("Department")},modifier=Modifier.fillMaxWidth()); OutlinedTextField(value=nStaff,onValueChange={nStaff=it},label={Text("Staff ID e.g. AZ004")},modifier=Modifier.fillMaxWidth())}}, confirmButton={Button(onClick={if(nName.length>=3){members=members+Member(members.size+1,nName.trim(),if(nDept.isBlank()) "General" else nDept,if(nStaff.isBlank()) "AZ00${members.size+1}" else nStaff); nName=""; nDept=""; nStaff=""; showAdd=false}}, colors=ButtonDefaults.buttonColors(containerColor=Green)){Text("Add")}}, dismissButton={TextButton(onClick={showAdd=false}){Text("Cancel")}})
                  }
                  if(showLoan){
                    AlertDialog(onDismissRequest={showLoan=false}, title={Text("New Loan - Guarantors Mandatory")}, text={Column{ OutlinedTextField(value=lMemberId,onValueChange={lMemberId=it},label={Text("Member ID")},modifier=Modifier.fillMaxWidth()); OutlinedTextField(value=lType,onValueChange={lType=it},label={Text("Type: Emergency/School/Dev")},modifier=Modifier.fillMaxWidth()); OutlinedTextField(value=lAmount,onValueChange={lAmount=it},label={Text("Amount UGX (max 3x savings)")},modifier=Modifier.fillMaxWidth()); OutlinedTextField(value=lMonths,onValueChange={lMonths=it},label={Text("Months e.g. 6")},modifier=Modifier.fillMaxWidth()); Text("Guarantors: First 2 members auto assigned, savings blocked",fontSize=9.sp,color=Color.Gray)}}, confirmButton={Button(onClick={val mid=lMemberId.toIntOrNull()?:1; val amt=lAmount.toDoubleOrNull()?:0.0; val mo=lMonths.toIntOrNull()?:6; val m=members.find{it.id==mid}; if(m!=null && amt>0 && amt<=m.savings*3){loans=loans+Loan(loans.size+1,mid,lType,amt,10.0,mo,"Active",listOf(1,2).filter{it!=mid},"${SimpleDateFormat("dd-MM-yyyy",Locale.getDefault()).format(Date())}"); members=members.map{if(it.id==mid) it.copy(loanBal=it.loanBal+amt) else if(it.id==1||it.id==2) it.copy(isGuarantor=true) else it}; txns=txns+Txn(SimpleDateFormat("dd-MM-yyyy",Locale.getDefault()).format(Date()),mid,"Loan",amt,"$lType $mo mo 10%"); showLoan=false}}, colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF1565C0))){Text("Approve Loan")}}, dismissButton={TextButton(onClick={showLoan=false}){Text("Cancel")}})
                  }
                  if(showShares){
                    AlertDialog(onDismissRequest={showShares=false}, title={Text("Buy Shares @20k")}, text={Text("Member ${selMember?.name} buys 1 share = 20,000 UGX. Shares increase dividend.")}, confirmButton={Button(onClick={selMember?.let{m->members=members.map{if(it.id==m.id) it.copy(shares=it.shares+1, savings=it.savings+20000) else it}; selMember=members.find{it.id==m.id}; txns=txns+Txn(SimpleDateFormat("dd-MM-yyyy",Locale.getDefault()).format(Date()),m.id,"Share",20000.0,"Buy 1 share")}; showShares=false}, colors=ButtonDefaults.buttonColors(containerColor=Gold)){Text("Buy 1 Share",color=Color.Black)}}, dismissButton={TextButton(onClick={showShares=false}){Text("Cancel")}})
                  }
                }
              }
            }
          }
          KOT
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="AZ ZEU SACCO" android:theme="@android:style/Theme.Material.Light">
            <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
           </application>
          </manifest>
          EOF
      - uses: gradle/gradle-build-action@v3
        with: { gradle-version: 8.5 }
      - name: Build APK
        run: |
          mkdir -p ~/.gradle; echo "android.useAndroidX=true" > ~/.gradle/gradle.properties
          gradle :app:assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZ-ZEU-SACCO-V14-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
