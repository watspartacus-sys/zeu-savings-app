name: Build Zeu APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Copy App
        run: |
          rm -rf app
          git clone https://github.com/watspartacus-sys/spendlimits temp
          cp -r temp/app app
          echo "include ':app'" > settings.gradle
      - name: Build
        run: wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip && unzip -q gradle-8.5-bin.zip &&./gradle-8.5/bin/gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeu-apk
          path: app/build/outputs/apk/debug/*.apk
