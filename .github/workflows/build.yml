name: Build Zeu APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create Zeu Savings App
        run: |
          mkdir -p app/src/main/java/com/zeu/savings
          mkdir -p app/src/main/res/layout
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.zeu.savings'
            compileSdk 34
            defaultConfig {
              applicationId "com.zeu.savings"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Zeu Savings" android:theme="@android:style/Theme.Light">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/zeu/savings/MainActivity.java <<'EOF'
          package com.zeu.savings;
          import android.app.Activity; import android.os.Bundle; import android.widget.*;
          import android.view.*; import java.util.*;
          import android.content.SharedPreferences;
          import org.json.*;
          public class MainActivity extends Activity {
            SharedPreferences prefs; LinearLayout main; TextView info;
            ArrayList<String> members=new ArrayList<>();
            protected void onCreate(Bundle b){
              super.onCreate(b); prefs=getSharedPreferences("zeu",0);
              load();
              ScrollView sv=new ScrollView(this);
              main=new LinearLayout(this); main.setOrientation(1); main.setPadding(20,20,20,20);
              sv.addView(main); setContentView(sv);
              TextView title=new TextView(this); title.setText("ZEU VILLAGE SAVINGS\nOffline - Unlimited Members"); title.setTextSize(20);
              main.addView(title);
              info=new TextView(this); main.addView(info); updateInfo();
              addBtn("Add Member",()->{ EditText e=new EditText(this); e.setHint("Name"); main.addView(e);
                Button ok=new Button(this); ok.setText("Save Member"); main.addView(ok);
                ok.setOnClickListener(v->{ if(!e.getText().toString().isEmpty()){ members.add(e.getText().toString()); save(); updateInfo(); main.removeView(e); main.removeView(ok);} }); });
              addBtn("Add Flexible Saving",()->{ EditText en=new EditText(this); en.setHint("Member Name"); EditText ea=new EditText(this); ea.setHint("Amount"); main.addView(en); main.addView(ea);
                Button ok=new Button(this); ok.setText("Record Saving"); main.addView(ok);
                ok.setOnClickListener(v->{ prefs.edit().putString("save_"+System.currentTimeMillis(), en.getText()+" : "+ea.getText()+" UGX "+new Date()).apply(); updateInfo(); main.removeView(en); main.removeView(ea); main.removeView(ok); Toast.makeText(this,"Saved offline!",0).show(); }); });
              addBtn("Give Loan with Deadline",()->{ EditText en=new EditText(this); en.setHint("Member"); EditText ea=new EditText(this); ea.setHint("Amount"); EditText ed=new EditText(this); ed.setHint("Deadline e.g. 30 Dec 2026"); main.addView(en); main.addView(ea); main.addView(ed);
                Button ok=new Button(this); ok.setText("Record Loan"); main.addView(ok);
                ok.setOnClickListener(v->{ prefs.edit().putString("loan_"+System.currentTimeMillis(), en.getText()+" borrowed "+ea.getText()+" deadline "+ed.getText()).apply(); updateInfo(); main.removeView(en); main.removeView(ea); main.removeView(ed); main.removeView(ok); }); });
              addBtn("Set Share-Out Period",()->{ EditText e=new EditText(this); e.setHint("e.g. Share-out: Dec 2026"); main.addView(e); Button ok=new Button(this); ok.setText("Save Period"); main.addView(ok); ok.setOnClickListener(v->{ prefs.edit().putString("shareout", e.getText().toString()).apply(); updateInfo(); main.removeView(e); main.removeView(ok); }); });
              addBtn("View All Records",()->{ StringBuilder sb=new StringBuilder(); Map<String,?> all=prefs.getAll(); for(String k:all.keySet()) sb.append(k).append(" -> ").append(all.get(k)).append("\n\n"); info.setText(sb.toString()); });
            }
            void addBtn(String t, Runnable r){ Button b=new Button(this); b.setText(t); b.setOnClickListener(v->r.run()); main.addView(b); }
            void save(){ try{ JSONArray a=new JSONArray(); for(String m:members) a.put(m); prefs.edit().putString("members",a.toString()).apply(); }catch(Exception e){} }
            void load(){ try{ String s=prefs.getString("members","[]"); JSONArray a=new JSONArray(s); for(int i=0;i<a.length();i++) members.add(a.getString(i)); }catch(Exception e){} }
            void updateInfo(){ String so=prefs.getString("shareout","Not set"); info.setText("Members: "+members.size()+" (Unlimited)\nShare-out: "+so+"\n\nAll data saved OFFLINE on phone.\nFlexible savings + Loans with deadline ready."); }
          }
          EOF
          echo "Zeu created"
      - name: Build APK with Gradle
        run: |
          cd app
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
         ./gradle-8.5/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zeu-apk
          path: app/build/outputs/apk/debug/*.apk
